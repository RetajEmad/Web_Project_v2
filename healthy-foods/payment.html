<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Healthy Foods Machines</title>
    <link rel="icon" type="image/png" href="whit with black background.png">
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div class="payment-container">
        <h1>Secure Checkout</h1>
        <form id="payment-form" class="payment-form">
            <h2>Payment Details</h2>

            <div class="form-group">
                <label for="cardName">Name on Card</label>
                <input type="text" id="cardName" name="cardName" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" required placeholder="XXXX XXXX XXXX XXXX" pattern="\d{4} \d{4} \d{4} \d{4}" maxlength="19">
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" name="expiry" required placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/?([0-9]{2})" maxlength="5">
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" required placeholder="XXX" pattern="\d{3}" maxlength="3">
                </div>
            </div>

            <h2>Total Amount: <span id="total-amount">0.00</span> EGP</h2>
            <div id="payment-message" class="message"></div>
            <button type="submit" id="pay-button">Complete Purchase</button>
        </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="payment.js"></script> 
</body>
</html>
